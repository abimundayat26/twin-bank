name: CI

# A gate the merge agent can rely on. main is not protected on this plan, so
# these checks are the only mechanical thing standing between an unattended
# agent and a broken demo.
on:
  pull_request:
    branches: [main, integration]
  push:
    branches: [main, integration]

# An unattended agent opens PRs faster than CI finishes. Keep only the newest
# run per branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are referenced anywhere in this file, and the defaults below keep
# it that way: every job runs on fixtures with the rule-based compiler, exactly
# as a fresh clone does. CI must never need a credential.
env:
  USE_MOCKS: "true"
  GOAL_COMPILER: rules
  TRACK_TWIN_BUILDS: "false"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # Run the canary on its own so a broken demo is obvious in the checks
      # list rather than buried in a 554-test summary.
      - name: Demo story canary
        run: uv run pytest tests/test_demo_story.py -q

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Fails the PR if a credential-shaped string reaches the diff. Cheap, and the
  # failure mode it guards against is unrecoverable.
  secrets:
    name: no secrets in diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for key-shaped strings and committed .env files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$base" ]; then
            files=$(git diff --name-only "$base" "$head")
          else
            files=$(git ls-files)
          fi
          [ -z "$files" ] && { echo "no files to scan"; exit 0; }

          status=0
          for f in $files; do
            case "$f" in
              .env.example) continue ;;
              .env|.env.*) echo "::error file=$f::committed env file"; status=1; continue ;;
            esac
            [ -f "$f" ] || continue
            if grep -nE 'sk-ant-[A-Za-z0-9_-]{8}|dapi[a-f0-9]{16}|ghp_[A-Za-z0-9]{20}' "$f"; then
              echo "::error file=$f::key-shaped string"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Revoke any real key in the Anthropic Console before fixing the diff."
          fi
          exit $status
